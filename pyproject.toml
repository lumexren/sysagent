[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sysagent"
dynamic = ["version"]
description = "Autonomous, self-evolving Linux system daemon and AI assistant powered by a hybrid Cloud + Local Neural architecture"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "google-genai>=3.2.0",
    "google-auth-oauthlib>=1.2.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "psutil>=6.0.0",
    "httpx>=0.27.0",
    "websockets>=13.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]
local = [
    "llama-cpp-python>=0.3.0",
]

[project.scripts]
sysagent = "sysagent.cli:main"

[tool.setuptools.dynamic]
version = { attr = "sysagent.__version__" }

[tool.setuptools.packages.find]
include = ["sysagent*"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "F",
    "E9",
    "B011",
    "B904",
    "B905",
    "PLW2901",
    "RET505",
    "SIM102",
    "SIM108",
    "SIM300",
    "SIM401",
    "UP035",
    "UP041",
    "C416",
    "C420",
    "RUF010",
    "RUF046",
    "RUF059",
    "RUF100",
]
