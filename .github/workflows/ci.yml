name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff
      - name: Ruff lint check
        run: |
          ruff check sysagent tests --select F,E9,B011,B904,B905,PLW2901,RET505,SIM102,SIM108,SIM300,SIM401,UP035,UP041,C416,C420,RUF010,RUF046,RUF059,RUF100
      - name: Run test suites
        run: |
          PYTHONPATH=. python tests/test_core.py
          PYTHONPATH=. python tests/test_server.py
          PYTHONPATH=. python tests/test_self_learn.py
          PYTHONPATH=. python tests/test_auto_coverage.py
          PYTHONPATH=. python tests/test_evolve_16.py
          PYTHONPATH=. python -m unittest tests/test_snapshots_top.py tests/test_local_improvements.py tests/test_mcp_bench_schedule.py tests/test_notification.py -v
