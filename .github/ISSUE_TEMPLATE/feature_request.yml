name: Feature Request
description: Suggest a new capability, Neural/Brain integration, or CLI improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Feature Summary
      description: What would you like SysAgent to do?
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Motivation / Use Case
      description: How does this improve daily workflows or autonomous behavior?
  - type: dropdown
    id: component
    attributes:
      label: Target Component
      options:
        - Agent / Chat
        - NeuralEngine
        - CognitiveBrain
        - SelfEvolver
        - Watcher / System
        - CLI / Packaging
